<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="Newlog.css">
</head>
<body>
     <h3>Simple Login Form </h3>
    <div id="page">
        <div id="rectangle">
            <div id="header">
                <h3>Login Form</h3>
                
                <div id="form">
                    <input type="text" placeholder="Email Address">
                    <input type="password" placeholder="Password">
                    <br><input type="checkbox" id="rememberme" >
                    <label for="rememberme" >Remember me</label>
                <button>Login</button>
                </div>
            </div>
        </div>
    </div>
  
</body>
</html>
