<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop_cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="Common.css">
    <link rel="stylesheet" href="Shop_cart.css">

<body>
    <div class="homepage">
        <!---Header--->
        <nav id="header">
            <div class="container">
                <div class="row">
                    <div class="header-wrapper d-flex justify-content-between">
                        <!--we have made this div flex , wiith justify content as space between -->
                        <div class="logo d-inline-block">
                            <a href="Shop_cart.html" class="text-decoration-none">Shop Cart</a>
                        </div>
                        <div class="user-actions d-flex flex-row">
                            <a href="Cart.html" >Cart</a>
                            <div class="user-intro" id="userIntro">Hi User</div>
                            <div class="logout-btn" id="logoutBtn">Logout</div>
                            <div class="login">
                                <a href="Login.html">Login</a>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </nav>
    </div>
    <!--main content-->
    <div class="container">

            <h2 class="home-title text-center">WELCOME TO SHOP CART</h2>
            <div class="category-list d-flex flex-row justify-content-between align-item-center" id="category-list">

                <div class="category-item d-flex align-item-center justify-content-center">

                </div>

                <div class="category-item d-flex align-item-center justify-content-center">

                </div>

                <div class="category-item d-flex align-item-center justify-content-center">

                </div>

                <div class="category-item d-flex align-item-center justify-content-center">
                   <a href=""> Sports</a>
                </div>

                <div class="category-item d-flex align-item-center justify-content-center">
                   <a href="">Gaming</a>
                </div>

            </div>

            <div class="category-title text-center">
                Select a category to start shopping
            </div>

        </div>
    </div>
