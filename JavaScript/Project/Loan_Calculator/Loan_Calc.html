<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="Loan_Calc.css">
</head>

<body>
    <div class="container">

        <div class="calculator">

            <h1>Loan Calculator</h1>

            <div class="Input_Group">

                <label for="Loan Amount">Loan Amount:</label>
                <input type="number" id="Loan Amount" placeholder="Enter Loan Amount">
            </div>

            <div class="Input_Group">

                <label for="Interest Rate">Interest Rate(%):</label>
                <input type="number" id="Interest Rate" placeholder="Enter Interest Rate">

            </div>

            <div class="Input_Group">
                <label>Loan Term (In Mounths)</label>
                <input type="number" id="Loan Term" placeholder="Enter Loan Term">

            </div>
            <button id="CalculateBtn">Calculate</button>
            <div id="result">Final Result</div>

        </div>

    </div>


</body>
<script src="Loan_Calc.js"></script>

</html>
