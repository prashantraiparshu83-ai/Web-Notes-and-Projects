<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company</title>
    <link rel="stylesheet" href="Form1.css">
</head>
<body>
   <div class="Full_Form">
     
    <div class="Companyname">Parshu Corporation</div>

    <form>
        <h4>Client Name:</h4>
        <input type="text" size="20"  placeholder="Full Name" maxlength="40" >

        <h4>Address:</h4>
        <input type="text" placeholder="Street Address"><br><br>
        <input type="text" placeholder="Street Address Line2">

        <br>
        <h4>City:</h4>
        <input type="text" maxlength="20">

        <h4>State/Province:</h4>
        <input type="text" maxlength="15">
        <h4>Postal/Zip Code</h4>
        <input type="text" maxlength="6">
        <h4>Telephone Number:</h4>
        <input type="text" name="Area Code" id="Area Code">
        <br>
        <label for="Area Code">Area Code</label>   
        <br><br>
        <input type="text" name="Area Code" id="Area Code">
        <br>
        <label for="Phone Number">Phone Number</label>   
        <br><br>
        <h4>Email address:</h4>

        <input type="text">

        <div class="button">
            <input type="button" value="Next">
        </div>

     
    </form>
   </div>
</body>
</html>
